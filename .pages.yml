# Pages CMS configuration – the client edits the site at https://app.pagescms.org
media:
  input: public/media
  output: /media
content:
  - name: products
    label: "Paintings"
    type: collection
    path: src/content/products
    format: json
    filename: '{fields.slug}.json'
    view:
      fields: [slug, price, order, active]
    fields:
      - { name: slug, label: "Link name (lowercase, dashes, no spaces)", type: string, required: true }
      - { name: active, label: "Show on website", type: boolean, default: true }
      - { name: order, label: "Position in the shop (1 = first)", type: number }
      - name: name
        label: "Painting name"
        type: object
        fields:
          - { name: en, label: "English", type: string }
          - { name: ar, label: "Arabic", type: string }
      - name: badge
        label: "Badge (e.g. New, Best seller) – leave empty for none"
        type: object
        fields:
          - { name: en, label: "English", type: string }
          - { name: ar, label: "Arabic", type: string }
      - name: level
        label: "Level (e.g. Intermediate)"
        type: object
        fields:
          - { name: en, label: "English", type: string }
          - { name: ar, label: "Arabic", type: string }
      - name: blurb
        label: "Short description"
        type: object
        fields:
          - { name: en, label: "English", type: text }
          - { name: ar, label: "Arabic", type: text }
      - name: about
        label: "Long description"
        type: object
        fields:
          - { name: en, label: "English", type: text }
          - { name: ar, label: "Arabic", type: text }
      - { name: price, label: "Price (EGP)", type: number }
      - { name: compare_price, label: "Old price before discount (EGP) – leave 0 for none", type: number }
      - name: orientation
        label: "Orientation"
        type: select
        options: { values: [landscape, portrait] }
      - name: images
        label: "Images"
        type: object
        fields:
          - { name: finished, label: "Finished painting (required)", type: image }
          - { name: numbered, label: "Numbered canvas (required)", type: image }
          - { name: reference, label: "Reference sheet", type: image }
          - { name: halfway, label: "Halfway painted (optional)", type: image }
          - { name: wall, label: "Painting on a wall (optional)", type: image }
          - { name: timelapse_map, label: "Timelapse map (optional, made automatically if empty)", type: image }
      - { name: palette, label: "Colour swatches (hex codes like #7A1F2B)", type: string, list: true }
  - name: settings
    label: "Store settings"
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: site_url, label: "Website address (with https://)", type: string }
      - { name: brand, label: "Brand name", type: string }
      - name: tagline
        label: "Tagline"
        type: object
        fields:
          - { name: en, label: "English", type: string }
          - { name: ar, label: "Arabic", type: string }
      - { name: currency, label: "Currency", type: string }
      - { name: delivery_fee, label: "Delivery fee (EGP)", type: number }
      - { name: default_price, label: "Default canvas price (EGP)", type: number }
      - { name: default_compare_price, label: "Default old price (EGP)", type: number }
      - { name: canvas_size, label: "Canvas size text", type: string }
      - { name: colours, label: "Number of colours", type: number }
      - name: custom_sizes
        label: "Custom canvas sizes and prices"
        type: object
        list: true
        fields:
          - { name: label, label: "Size", type: string }
          - { name: price, label: "Price (EGP)", type: number }
      - name: custom_example
        label: "Custom canvas example images"
        type: object
        fields:
          - { name: finished, label: "Finished", type: image }
          - { name: numbered, label: "Numbered", type: image }
          - { name: reference, label: "Reference", type: image }
          - { name: halfway, label: "Halfway", type: image }
      - { name: phone_display, label: "Support phone (as shown)", type: string }
      - { name: phone_intl, label: "Support phone, international without + (e.g. 201270820513)", type: string }
      - { name: whatsapp_intl, label: "WhatsApp number, international without +", type: string }
      - { name: email, label: "Store email", type: string }
      - { name: instapay, label: "InstaPay address shown after an InstaPay order", type: string }
      - { name: vodafone_cash, label: "Vodafone Cash number shown after a Vodafone Cash order", type: string }
      - name: payments
        label: "Payment methods"
        type: object
        fields:
          - { name: cod, label: "Cash on delivery", type: boolean }
          - { name: instapay, label: "InstaPay", type: boolean }
          - { name: vodafone_cash, label: "Vodafone Cash", type: boolean }
          - { name: kashier, label: "Online payment by card / wallet (Kashier) – turn on only after the Kashier keys are added", type: boolean }
      - { name: orders_endpoint, label: "Orders web app link (from Google Apps Script)", type: string }
      - name: analytics
        label: "Analytics and tracking"
        type: object
        fields:
          - { name: ga4_id, label: "Google Analytics ID (G-XXXXXXX)", type: string }
          - { name: clarity_id, label: "Microsoft Clarity project ID", type: string }
          - { name: meta_pixel_id, label: "Meta Pixel ID", type: string }
          - { name: google_site_verification, label: "Google Search Console verification code", type: string }
      - name: social
        label: "Social media links"
        type: object
        fields:
          - { name: instagram, label: "Instagram", type: string }
          - { name: facebook, label: "Facebook", type: string }
          - { name: tiktok, label: "TikTok", type: string }
      - { name: launch_offer, label: "Show the launch offer banner", type: boolean }
  - name: hero
    label: "Home page videos"
    type: file
    path: src/data/hero.json
    format: json
    list: true
    fields:
      - { name: video, label: "Video path without extension (upload .mp4 and .webm with the same name)", type: string }
      - { name: poster, label: "Cover image", type: image }
      - name: caption
        label: "Caption"
        type: object
        fields:
          - { name: en, label: "English", type: string }
          - { name: ar, label: "Arabic", type: string }
      - { name: link, label: "Link (e.g. products/starry-hollow or #kit)", type: string }
  - name: faq
    label: "Questions (FAQ)"
    type: file
    path: src/data/faq.json
    format: json
    list: true
    fields:
      - name: q
        label: "Question"
        type: object
        fields:
          - { name: en, label: "English", type: text }
          - { name: ar, label: "Arabic", type: text }
      - name: a
        label: "Answer"
        type: object
        fields:
          - { name: en, label: "English", type: text }
          - { name: ar, label: "Arabic", type: text }
  - name: reviews
    label: "Customer reviews"
    type: file
    path: src/data/reviews.json
    format: json
    fields:
      - { name: show, label: "Show reviews section", type: boolean }
      - { name: sample, label: "Mark as sample reviews", type: boolean }
      - name: items
        label: "Reviews"
        type: object
        list: true
        fields:
          - { name: stars, label: "Stars (1-5)", type: number }
          - name: text
            label: "Review"
            type: object
            fields:
              - { name: en, label: "English", type: text }
              - { name: ar, label: "Arabic", type: text }
          - name: who
            label: "Painting or customer"
            type: object
            fields:
              - { name: en, label: "English", type: text }
              - { name: ar, label: "Arabic", type: text }
